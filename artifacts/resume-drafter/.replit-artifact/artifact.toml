kind = "web"
previewPath = "/"
title = "Resume Drafter"
version = "1.0.0"
id = "artifacts/resume-drafter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20817

[services.development]
run = "pnpm --filter @workspace/resume-drafter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/resume-drafter", "run", "build" ]
publicDir = "artifacts/resume-drafter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20817"
BASE_PATH = "/"
